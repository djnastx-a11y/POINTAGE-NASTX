<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Mise à jour</title><style>body{font-family:system-ui,sans-serif;background:#f4ecdf;color:#181512;min-height:100vh;display:grid;place-items:center;margin:0}.box{max-width:360px;padding:28px;text-align:center}.spin{width:36px;height:36px;border:4px solid #d8cbbb;border-top-color:#222;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><b>Mise à jour sécurisée de l’application…</b></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/POINTAGE-NASTX/team-app-next/')).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('australia-team-next-')).map(k=>caches.delete(k)))}}catch(e){console.error(e)}location.replace('./?v=260')})()</script></body></html>
