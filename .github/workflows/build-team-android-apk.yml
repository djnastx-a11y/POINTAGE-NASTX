name: Build Team Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'team-android-app/**'
      - '.github/workflows/build-team-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare stable APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk Australia-Street-Equipe.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Australia-Street-Equipe-Android-1.0.0
          path: team-android-app/Australia-Street-Equipe.apk
          retention-days: 30

      - name: Publish stable installation release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view team-android-latest >/dev/null 2>&1; then
            gh release create team-android-latest --title "Australia Street Équipe Android" --notes "Version Android installable de l'application équipe Australia Street."
          fi
          gh release upload team-android-latest Australia-Street-Equipe.apk --clobber
